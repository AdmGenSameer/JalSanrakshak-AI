version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: backend
    restart: always
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
    environment:
      - SQLITE_DB_PATH=/app/data/rtrwh_assessment.db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dokploy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - dokploy-network

volumes:
  backend_data:

networks:
  dokploy-network:
    external: true

